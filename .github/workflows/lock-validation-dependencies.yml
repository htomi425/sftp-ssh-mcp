name: Lock Cloudflare validation dependencies
on:
  push:
    branches: [validation/pr-10-dependency-lock]
    paths: ['.github/workflows/lock-validation-dependencies.yml']
permissions:
  contents: read
jobs:
  lock-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install root and compile Node origin
        run: npm ci
      - name: Resolve validation dependencies once and pin direct versions
        working-directory: integrations/cloudflare/validation
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          for (const name of Object.keys(manifest.dependencies)) {
            manifest.dependencies[name]=lock.packages['node_modules/'+name].version;
          }
          writeFileSync('package.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
      - name: Test all isolated OAuth paths against locked dependencies
        working-directory: integrations/cloudflare/validation
        run: |
          npm run check:provider
          npm run check:workerd
          npm run check:binding
          npm run check:provider-binding
          npm run check:real-oauth-binding
          npm run check:real-oauth-pkce
      - name: Preserve tested manifest and lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locked-cloudflare-validation
          path: |
            integrations/cloudflare/validation/package.json
            integrations/cloudflare/validation/package-lock.json
