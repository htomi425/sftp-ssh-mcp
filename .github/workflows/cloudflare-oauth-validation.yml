name: Cloudflare OAuth Provider validation (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/cloudflare/validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install isolated provider package
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject known high-severity validation dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify real v1 package imports and constructor
        run: npm run check:provider
