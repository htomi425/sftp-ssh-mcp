name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect executable changes
    runs-on: ubuntu-latest
    outputs:
      needs_ci: ${{ steps.filter.outputs.needs_ci }}
    steps:
      - name: Checkout full history for reliable PR and push diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skip heavy tests only for documentation-only changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.after || github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.event.after || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          needs_ci=true
          # For PR synchronize, compare the newly pushed commits, not the entire PR.
          # On PR open/reopen or if synchronize has no usable before/after pair,
          # fall back to the full PR diff. Only allow incremental skip when the
          # previous head is an ancestor; force-push/rebases require full CI.
          if [[ "$EVENT_NAME" == pull_request && "$PR_ACTION" == synchronize ]]; then
            if [[ -n "$BEFORE_SHA" && -n "$AFTER_SHA" ]] &&
               git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; then
              echo 'Checking PR synchronize delta'
            else
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              echo 'Checking full PR diff (missing or non-ancestor synchronize delta)'
            fi
          fi
          # A new branch or an unavailable comparison must not silently skip tests.
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" &&
             git cat-file -e "${HEAD_SHA}^{commit}"; then
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            doc_only=true
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                README.md|README.ja.md|docs/*.md|integrations/cloudflare/README.md)
                  echo "Documentation: $path" ;;
                *)
                  echo "Executable or unclassified change: $path"
                  doc_only=false ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            if [[ "$doc_only" == true && "$count" -gt 0 ]]; then
              needs_ci=false
            fi
          fi
          echo "needs_ci=$needs_ci" >> "$GITHUB_OUTPUT"
          echo "Run heavy CI: $needs_ci"

  build:
    needs: changes
    if: needs.changes.outputs.needs_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Dependency audit (report only during migration)
        run: npm audit --omit=dev --json > audit.json || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-node-${{ matrix.node-version }}
          path: audit.json
          if-no-files-found: ignore
      - name: Install and test Zod 4 candidate (refactor branch only)
        if: github.head_ref == 'refactor/core' || github.ref == 'refs/heads/refactor/core'
        run: npm install zod@^4 --save --ignore-scripts --no-audit
      - name: Build and test candidate
        if: github.head_ref == 'refactor/core' || github.ref == 'refs/heads/refactor/core'
        run: npm test
      - name: Record production dependency audit
        if: github.head_ref == 'refactor/core' || github.ref == 'refs/heads/refactor/core'
        run: npm audit --omit=dev --json > zod4-audit.json || true
      - name: Upload candidate artifacts
        if: github.head_ref == 'refactor/core' || github.ref == 'refs/heads/refactor/core'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zod4-ci-node-${{ matrix.node-version }}
          path: |
            package.json
            package-lock.json
            zod4-audit.json


  integration:
    needs: changes
    if: needs.changes.outputs.needs_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Configure isolated SSH test server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh-integration"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ssh-integration/client"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ssh-integration/host"
          chmod 700 "$RUNNER_TEMP/ssh-integration"
          cp "$RUNNER_TEMP/ssh-integration/client.pub" "$RUNNER_TEMP/ssh-integration/authorized_keys"
          chmod 600 "$RUNNER_TEMP/ssh-integration/authorized_keys"
          printf '%s\n' \
            'Port 22222' \
            'ListenAddress 127.0.0.1' \
            "HostKey $RUNNER_TEMP/ssh-integration/host" \
            "AuthorizedKeysFile $RUNNER_TEMP/ssh-integration/authorized_keys" \
            'PasswordAuthentication no' \
            'PubkeyAuthentication yes' \
            'PermitRootLogin no' \
            'UsePAM yes' \
            'StrictModes no' \
            'Subsystem sftp internal-sftp' \
            'PidFile /tmp/ssh-mcp-test-sshd.pid' \
            > "$RUNNER_TEMP/ssh-integration/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/ssh-integration/sshd_config" -E "$RUNNER_TEMP/ssh-integration/sshd.log"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ssh-integration/host.pub" -E sha256 | awk '{print $2}')"
          hex="$(node -e "console.log(Buffer.from(process.argv[1].replace(/^SHA256:/,''),'base64').toString('hex'))" "$fingerprint")"
          {
            echo 'SSH_INTEGRATION_HOST=127.0.0.1'
            echo 'SSH_INTEGRATION_PORT=22222'
            echo "SSH_INTEGRATION_USER=$(whoami)"
            echo "SSH_INTEGRATION_KEY=$RUNNER_TEMP/ssh-integration/client"
            echo "SSH_INTEGRATION_HOST_KEY_HEX=$hex"
          } >> "$GITHUB_ENV"
      - name: Run SSH/SFTP integration tests
        run: node --test tests/ssh-integration.test.mjs
      - name: Show sshd logs on failure
        if: failure()
        run: sudo cat "$RUNNER_TEMP/ssh-integration/sshd.log" || true

  cloudflare-oauth-provider:
    needs: changes
    if: needs.changes.outputs.needs_ci == 'true' && (github.ref == 'refs/heads/refactor/core' || github.head_ref == 'refactor/core')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/cloudflare/validation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install root dependencies for Node origin verifier
        run: npm ci
        working-directory: .
      - name: Compile Node origin verifier
        run: npm run build
        working-directory: .
      - name: Install isolated Cloudflare OAuth Provider
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify Cloudflare runtime-specific package imports with workerd-compatible bundler
        run: npm run check:provider
      - name: Verify OAuth resource server inside workerd
        run: npm run check:workerd
      - name: Verify private Service Binding RPC inside workerd
        run: npm run check:binding
      - name: Verify OAuth resource token rejection via Service Binding
        run: npm run check:provider-binding
      - name: Verify real OAuth provider and KV token rejection over Service Binding
        run: npm run check:real-oauth-binding
      - name: Verify OAuth PKCE authorization code and token acceptance in workerd
        run: npm run check:real-oauth-pkce
