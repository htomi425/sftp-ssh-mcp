name: Zod 4 compatibility (candidate only)

on:
  push:
    branches:
      - refactor/core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zod4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Zod 4 in temporary candidate only
        run: npm install zod@^4 --save --ignore-scripts --no-audit
      - name: Check build and unit tests
        run: |
          npm run build
          npm test
      - name: Audit production dependencies
        if: always()
        run: npm audit --omit=dev --json > zod4-audit.json || true
      - name: Preserve candidate and audit for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zod4-candidate-node-${{ matrix.node-version }}
          path: |
            package.json
            package-lock.json
            zod4-audit.json
