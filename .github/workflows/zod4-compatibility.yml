name: Zod 4 compatibility (candidate only)

on:
  push:
    branches:
      - refactor/core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zod4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Zod 4 in temporary candidate only
        run: npm install zod@^4 --save --ignore-scripts --no-audit
      - name: Check build and unit tests
        run: |
          npm run build
          npm test
      - name: Audit production dependencies
        if: always()
        run: npm audit --omit=dev --json > zod4-audit.json || true
      - name: Preserve candidate and audit for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zod4-candidate-node-${{ matrix.node-version }}
          path: |
            package.json
            package-lock.json
            zod4-audit.json
