name: Dependency review (candidate only)

on:
  workflow_dispatch:
  push:
    branches: [refactor/core]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-review.yml'
      - 'scripts/validate-dependency-lock.mjs'
      - 'tests/dependency-candidate.test.mjs'

permissions:
  contents: read

jobs:
  review:
    if: github.ref == 'refs/heads/refactor/core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Preserve baseline lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-baseline"
          cp package-lock.json "$RUNNER_TEMP/dependency-baseline/package-lock.json"
      - name: Install locked baseline dependencies
        run: npm ci
      - name: Record baseline dependency tree and vulnerabilities
        run: |
          npm ls --all --json > baseline-tree.json || true
          npm audit --json > baseline-audit.json || true
      - name: Resolve non-breaking updates into candidate lockfile
        run: npm update --package-lock-only --ignore-scripts --no-audit
      - name: Test candidate dependency resolution without repository write credentials
        run: |
          npm ci
          npm test
      - name: Gate production candidate on high-severity dependency audit
        run: npm audit --omit=dev --audit-level=high --json > candidate-production-audit.json
      - name: Validate candidate artifact
        run: node scripts/validate-dependency-lock.mjs package-lock.json "$RUNNER_TEMP/dependency-baseline/package-lock.json"
      - name: Check for a lockfile update
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload only the candidate data for the publisher
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-dependency-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Record candidate dependency tree and vulnerabilities
        if: always()
        run: |
          npm ls --all --json > candidate-tree.json || true
          npm audit --json > candidate-audit.json || true
      - name: Preserve review reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-review-candidate
          path: |
            package-lock.json
            baseline-tree.json
            baseline-audit.json
            candidate-tree.json
            candidate-audit.json
            candidate-production-audit.json

  apply:
    name: Apply validated lockfile data without executing candidate dependencies
    needs: review
    if: needs.review.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/refactor/core'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download the candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-dependency-lockfile
          path: ${{ runner.temp }}/dependency-candidate
      - name: Validate and apply only package-lock.json if the branch is unchanged
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin refs/heads/refactor/core | cut -f1)"
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo 'Branch advanced; candidate must be regenerated. No update applied.'
            exit 0
          fi
          candidate="$RUNNER_TEMP/dependency-candidate/package-lock.json"
          node scripts/validate-dependency-lock.mjs "$candidate" package-lock.json
          if cmp -s "$candidate" package-lock.json; then
            echo 'Lockfile already up to date'
            exit 0
          fi
          cp "$candidate" package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null add -- package-lock.json
          git -c core.hooksPath=/dev/null commit -m 'chore(deps): apply tested compatible lockfile updates'
          # No force: a later concurrent push must reject this update.
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/refactor/core
