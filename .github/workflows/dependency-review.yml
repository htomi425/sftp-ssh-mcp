name: Dependency review (candidate only)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - refactor/core

permissions:
  contents: write

jobs:
  review:
    if: github.head_ref == 'refactor/core' || github.ref == 'refs/heads/refactor/core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked baseline dependencies
        run: npm ci
      - name: Record baseline dependency tree and vulnerabilities
        shell: bash
        run: |
          npm ls --all --json > baseline-tree.json || true
          npm audit --json > baseline-audit.json || true
      - name: Resolve non-breaking updates into candidate lockfile
        run: npm update --package-lock-only --ignore-scripts --no-audit
      - name: Test candidate dependency resolution
        run: |
          npm ci
          npm test
      - name: Record candidate dependency tree and vulnerabilities
        if: always()
        shell: bash
        run: |
          npm ls --all --json > candidate-tree.json || true
          npm audit --json > candidate-audit.json || true
      - name: Commit verified candidate to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/core' && success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): apply tested compatible lockfile updates'
          git push origin HEAD:refactor/core
      - name: Upload candidate for manual review (no repository changes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-review-candidate
          path: |
            package-lock.json
            baseline-tree.json
            baseline-audit.json
            candidate-tree.json
            candidate-audit.json
